; PlatformIO Project Configuration File for Flori Smart Plant Companion
; Platform: ESP8266 NodeMCU V2
; Framework: Arduino
; Single Master Code Setup: Compiles code.ino directly

[platformio]
default_envs = nodemcuv2
src_dir = .

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
board_build.f_cpu = 160000000L
framework = arduino
upload_port = COM12
upload_speed = 115200
monitor_port = COM12
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, default

; Automatic dependency resolution from PlatformIO Registry
lib_deps =
    links2004/WebSockets @ ^2.4.1
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
